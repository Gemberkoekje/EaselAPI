name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: every job here only reads the checkout and uploads a build
# artifact, so the default (frequently broader) GITHUB_TOKEN scope is unneeded.
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts examples

      - name: Test
        run: pytest -q

      - name: Regenerate the brush sampler
        run: python scripts/make_brush_sampler.py

      - name: Upload the sampler sheet
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: brush-sampler-${{ matrix.os }}-py${{ matrix.python-version }}
          path: samples/brushes.png
          if-no-files-found: error

  # The mixbox extra (pymixbox) is opt-in -- see color.py's note on its
  # CC BY-NC licence -- so it is not part of the `test` job's install above,
  # and the KS-specific assertions in test_floor.py and the golden images
  # are not written to be mixbox-aware. This job only exercises the
  # integration seam itself, in tests/test_mixbox.py, so the extra actually
  # gets tested somewhere instead of the call site in color.mix_many going
  # completely unexercised by CI.
  mixbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install with the mixbox extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mixbox]"

      - name: Test the mixbox integration seam
        run: pytest -q tests/test_mixbox.py
