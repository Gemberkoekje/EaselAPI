name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests scripts examples

      - name: Test
        run: pytest -q

      - name: Regenerate the brush sampler
        run: python scripts/make_brush_sampler.py

      - name: Upload the sampler sheet
        uses: actions/upload-artifact@v7
        with:
          name: brush-sampler-${{ matrix.os }}-py${{ matrix.python-version }}
          path: samples/brushes.png
          if-no-files-found: error
