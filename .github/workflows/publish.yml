name: Publish

# Two ways in, and they land in different places:
#
#   workflow_dispatch  ->  TestPyPI, a rehearsal
#   a v* tag           ->  PyPI, the real thing
#
# so a rehearsal cannot spend a real version number by accident. A release is cut
# by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege, as in ci.yml: the default for the whole file is a read of the
# checkout, and the one job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  # ci.yml triggers on pushes to main and on pull requests -- not on tags. So a
  # tag push runs no checks at all unless this job runs them, and the one commit
  # that must not be broken would be the only one nobody looked at.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      # The version in pyproject.toml is written by hand, so a tag can disagree
      # with it. Publishing the disagreement is the expensive way to find out: a
      # PyPI version number cannot be reused, even after the file is deleted.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME says $tag; pyproject.toml says $version." >&2
            exit 1
          fi
          echo "Publishing $version."

      - name: Lint
        run: ruff check src tests scripts examples mcpb

      - name: Test
        run: pytest -q

      - name: Build the distributions
        run: python -m build

      # README.md is the PyPI long description, and one PyPI will not render is
      # refused at upload -- after the version number has already been taken.
      - name: Check the distributions
        run: python -m twine check dist/*

      # Packing here rather than in the job that publishes it, because packing is
      # the half that can fail on a mistake -- a manifest that does not validate,
      # a renamed placeholder -- and this job runs on a rehearsal too. The bundle
      # is only *installable* once its pinned version is on PyPI, which is why
      # publishing it waits for the `pypi` job below.
      - name: Pack the desktop bundle
        run: python scripts/pack_mcpb.py

      # dist/ now holds the sdist, the wheel and easel.mcpb. The staging copy
      # pack_mcpb.py works in is next to them and is not worth carrying, and
      # `dist/*` in the pattern list would sweep it in.
      - name: Upload the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/*.tar.gz
            dist/*.whl
            dist/easel.mcpb
          if-no-files-found: error

  # The rehearsal. TestPyPI is a separate instance with its own accounts and its
  # own trusted publisher -- a PyPI login does not work there -- and it burns a
  # version number exactly as PyPI does. `skip-existing` is what keeps a second
  # rehearsal of the same version a no-op rather than a failure; to genuinely
  # re-test a changed README, bump the version in pyproject.toml to a dev release
  # like 0.1.0.dev2 first, because the upload that already happened is immutable.
  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/easel-paint
    permissions:
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Set the bundle aside
        run: rm -f dist/easel.mcpb

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  # Trusted publishing: PyPI accepts an OIDC token minted for this repository,
  # this workflow *file name* and this environment, so there is no API token
  # anywhere in the repo or its secrets. Renaming this file or the environment
  # breaks the match, and the publisher configured on PyPI has to be edited to
  # agree again. The job name is not part of that match, only the file and the
  # environment.
  #
  # This job deliberately does not check the repository out. Naming `permissions`
  # here replaces the file-level default rather than adding to it, so the token
  # it runs with can mint an OIDC assertion and do nothing else.
  #
  # No `skip-existing` here, unlike the rehearsal above: on the real index a
  # version that is already taken is something to stop for, not to shrug at.
  pypi:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/easel-paint
    permissions:
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      # The bundle rides in the same artifact but is not a Python distribution,
      # and the upload action would refuse the whole directory over it.
      - name: Set the bundle aside
        run: rm -f dist/easel.mcpb

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # The bundle is the one artefact here with nowhere else to go. PyPI takes
  # distributions and the registry takes metadata; a .mcpb is neither, and a
  # one-click install file is useless without a stable public URL. So this is the
  # first job in this repository to cut a GitHub release -- a tag that used to be
  # only a tag now carries notes and an asset.
  #
  # It waits on `pypi` for the reason the registry job does. The bundle contains
  # no engine, only a pin, and an install resolves that pin from PyPI; published
  # any earlier it would be a file on the internet that cannot install yet, or at
  # all if the upload failed.
  bundle:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write   # cutting the release, and attaching the bundle to it

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      # Pinned like everything else on the release path. uv is not a build input
      # here -- it is the thing being rehearsed, since `uv run` is literally the
      # command the manifest tells a host to use.
      - name: Install uv
        run: python -m pip install "uv==0.12.13"

      # The step that makes this more than a zip upload. `mcpb unpack` plus
      # `uv run` is exactly what an installing host does, so a bundle that cannot
      # resolve its own pin fails here rather than in front of whoever downloads
      # it -- and nothing else in CI installs a desktop extension.
      #
      # The retry is the same PyPI propagation allowance the registry job makes: a
      # version can be accepted by the upload and not yet be visible to a resolver.
      - name: Check the bundle installs
        run: |
          npx --yes @anthropic-ai/mcpb@2.1.2 unpack dist/easel.mcpb unpacked
          for delay in 0 15 30 60; do
            if [ "$delay" -gt 0 ]; then
              echo "Retrying in ${delay}s -- PyPI may not have propagated yet."
              sleep "$delay"
            fi
            if uv run --directory unpacked src/server.py --help; then
              exit 0
            fi
          done
          echo "::error::The bundle did not resolve easel-paint from PyPI." >&2
          exit 1

      # `create` only if the tag has no release yet, and `--clobber` on the upload,
      # so re-running this after a failure replaces the asset instead of colliding
      # with the one the failed run already attached.
      - name: Attach the bundle to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" dist/easel.mcpb --clobber

  # The MCP registry stores metadata, not artefacts, and it stores it pinned to a
  # version: nothing in it updates itself when a new release reaches PyPI, so
  # without this job the entry silently goes on advertising whatever was last
  # published by hand.
  #
  # It runs after `pypi` rather than beside it, and that ordering is the whole
  # trick: the registry proves the namespace is ours by reading the `mcp-name:`
  # marker out of the *published* package description, so the release has to
  # exist on PyPI before this can succeed.
  #
  # If this job fails, the PyPI release is still done and good -- only the
  # registry entry is stale, and `mcp-publisher publish` from a checkout fixes it.
  registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read    # server.json is the thing being published
      id-token: write   # GitHub Actions OIDC, so there is no token to store

    env:
      # Pinned rather than `latest`, because this binary runs in the one job that
      # can mint an OIDC token in the maintainer's name. v1.8.1 is commit
      # f52dc8525a441a3abf5fedc9912152d95af5aab1, which is what a locally
      # installed `mcp-publisher --version` reports.
      MCP_PUBLISHER_VERSION: v1.8.1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The one thing here named by version rather than by digest, because it is
      # a release asset rather than a git ref -- so the checksum is verified out
      # of the same release. The asset names are goreleaser's, from the config at
      # that tag: archives are `mcp-publisher_{{ .Os }}_{{ .Arch }}` and the
      # checksum file takes the default name. `-f` on both curls matters: without
      # it a 404 page is written to the file and the checksum fails confusingly
      # instead of the download failing plainly.
      #
      # Further hardening available and not taken: goreleaser also cosign-signs
      # both the archive and the checksums file into `.sigstore.json` bundles,
      # which would catch a re-cut tag as this does not. That needs the release
      # workflow's certificate identity, which should be read rather than guessed.
      - name: Install mcp-publisher
        run: |
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL "$base/mcp-publisher_linux_amd64.tar.gz" -o mcp-publisher_linux_amd64.tar.gz
          curl -fsSL "$base/checksums.txt" -o checksums.txt
          grep ' mcp-publisher_linux_amd64.tar.gz$' checksums.txt | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Authenticate with the registry
        run: ./mcp-publisher login github-oidc

      # PyPI's description is fetched by the registry server-side and is not
      # always visible the instant the upload returns. Failing the release over
      # that would be failing a release that has already succeeded, so it gets a
      # few tries before it counts as broken.
      - name: Publish to the MCP Registry
        run: |
          for delay in 0 15 30 60; do
            if [ "$delay" -gt 0 ]; then
              echo "Retrying in ${delay}s -- PyPI may not have propagated yet."
              sleep "$delay"
            fi
            if ./mcp-publisher publish; then
              exit 0
            fi
          done
          echo "::error::mcp-publisher publish did not succeed. The PyPI release is unaffected; re-run it from a checkout." >&2
          exit 1
