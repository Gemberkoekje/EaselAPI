name: Publish

# A release is cut by pushing a tag: `git tag v0.1.0 && git push origin v0.1.0`.
# `workflow_dispatch` is here for the first publish and for re-running a release
# whose upload failed after the build had already passed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege, as in ci.yml: the default for the whole file is a read of the
# checkout, and the one job that needs more asks for it itself.
permissions:
  contents: read

jobs:
  # ci.yml triggers on pushes to main and on pull requests -- not on tags. So a
  # tag push runs no checks at all unless this job runs them, and the one commit
  # that must not be broken would be the only one nobody looked at.
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" build twine

      # The version in pyproject.toml is written by hand, so a tag can disagree
      # with it. Publishing the disagreement is the expensive way to find out: a
      # PyPI version number cannot be reused, even after the file is deleted.
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(python -c "import tomllib, pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "Tag $GITHUB_REF_NAME says $tag; pyproject.toml says $version." >&2
            exit 1
          fi
          echo "Publishing $version."

      - name: Lint
        run: ruff check src tests scripts examples

      - name: Test
        run: pytest -q

      - name: Build the distributions
        run: python -m build

      # README.md is the PyPI long description, and one PyPI will not render is
      # refused at upload -- after the version number has already been taken.
      - name: Check the distributions
        run: python -m twine check dist/*

      - name: Upload the distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  # Trusted publishing: PyPI accepts an OIDC token minted for this repository,
  # this workflow *file name* and this environment, so there is no API token
  # anywhere in the repo or its secrets. Renaming this file or the environment
  # breaks the match, and the publisher configured on PyPI has to be edited to
  # agree again.
  #
  # This job deliberately does not check the repository out. Naming `permissions`
  # here replaces the file-level default rather than adding to it, so the token
  # it runs with can mint an OIDC assertion and do nothing else.
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/easel-paint
    permissions:
      id-token: write

    steps:
      - name: Download the distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
