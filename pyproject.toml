[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "easel-paint"
version = "0.1.0"
description = "A headless painting engine for AI agents: brushes, paint load, wet blending, canvas texture."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [{ name = "Arie Hofland" }]
keywords = ["painting", "brush", "raster", "agent", "llm", "headless", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "numpy>=1.26",
    "pillow>=10.0",
]

[project.optional-dependencies]
mixbox = ["pymixbox>=2.0"]
# The MCP server (`easel-mcp`). Opt-in, like mixbox: nothing else in the engine
# imports `mcp`, and a painter working from Python or the shell never needs it.
# Held below 3 because the tool-registration API is what this pins against --
# 2.x is where FastMCP became MCPServer, and 1.x will not import easel.mcp_server.
mcp = ["mcp>=2.0,<3"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
easel = "easel.cli:main"
easel-mcp = "easel.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Gemberkoekje/EaselAPI"
Issues = "https://github.com/Gemberkoekje/EaselAPI/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/easel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
